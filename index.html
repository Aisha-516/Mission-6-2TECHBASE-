<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日やることルーレット</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎯 今日やることルーレット</h1>

        <p>次にやることをルーレットで決めよう！</p>

        <button id="rouletteButton">ルーレットを回す</button>

        <div id="result"></div>

        <hr>

        <h2>📝 今日のタスク</h2>

        <div class="input-area">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="やることを入力してください"
            >

            <button id="addButton">追加</button>
        </div>

        <ul id="taskList"></ul>

        <button id="deleteAllButton">すべて削除</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
